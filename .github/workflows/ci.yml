name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install TypeScript for the facts-scan tests (a test tool, not a dependency of the plugin)
        shell: bash
        run: npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.8.3
      - name: Run tests
        shell: bash
        run: node --test
